name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: Docker Compose PostgreSQL 16 smoke test
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: analytics_compose
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --wait
      - run: >-
          docker compose exec -T postgres
          psql -U analytics -d analytics_compose -c "SELECT version();"
      - if: always()
        run: docker compose down -v

  unit:
    name: Unit and portable integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-lock.txt
      - run: >-
          python -m ruff check config database pipeline storage scripts/demo.py
          tests/test_release_hardening.py tests/test_postgres_integration.py
      - run: python -m pytest -q -m "not postgres"

  postgres:
    name: PostgreSQL 16 migrations and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: analytics
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: analytics_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U analytics -d analytics_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://analytics:ci-only-password@localhost:5432/analytics_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m alembic upgrade head
      - run: python -m pytest -q -m postgres
      - run: python -m pytest -q

  release:
    name: Tag v1.0.0 after green CI
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - compose
      - unit
      - postgres
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create the first release tag once
        run: |
          if git show-ref --tags --verify --quiet refs/tags/v1.0.0; then
            echo "v1.0.0 already exists; leaving it unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v1.0.0 -m "Portfolio v1.0.0"
          git push origin refs/tags/v1.0.0
